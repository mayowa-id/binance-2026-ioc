# Newline-delimited JSON. _time will be a Unix epoch in synthetic fixtures.
# Search-time extraction avoids duplicate indexed/search-time JSON fields.
[wallet:withdrawals]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
KV_MODE = json
TIME_PREFIX = "_time"\s*:\s*"?
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 20

